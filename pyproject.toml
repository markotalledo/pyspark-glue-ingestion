[project]
name = "pyspark-glue-ingestion"
version = "0.1.0"
description = "PySpark job on AWS Glue that turns raw events into clean, deduplicated Parquet partitioned by event date."
# Glue 5.0 runs Python 3.11 and Spark 3.5.4: match it locally.
requires-python = ">=3.11,<3.12"
dependencies = ["pyspark==3.5.4"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clean_events"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
